name: Update sober counter

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute days and update badge
        run: |
          START_DATE="2026-01-20"
          TODAY=$(date -u +%Y-%m-%d)
          DAYS=$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$START_DATE" +%s) ) / 86400 ))
          BADGE="<img alt=\"Sober from Monster\" src=\"https://img.shields.io/badge/Sober%20from%20Monster-${DAYS}%20days-FF3F7F?style=for-the-badge\"/>"
          python3 - "$BADGE" <<'PYEOF'
          import re, sys, pathlib
          badge = sys.argv[1]
          p = pathlib.Path("README.md")
          text = p.read_text(encoding="utf-8")
          new = re.sub(
              r'(<!-- SOBER-COUNTER:START -->\n).*?(\n<!-- SOBER-COUNTER:END -->)',
              lambda m: m.group(1) + badge + m.group(2),
              text,
              flags=re.S,
          )
          p.write_text(new, encoding="utf-8")
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update sober counter"
          git push
